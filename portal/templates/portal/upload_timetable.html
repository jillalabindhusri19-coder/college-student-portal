<!DOCTYPE html>
<html>

<head>
    <title>Upload Time Table</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            text-align: center;
        }

        .header {
            background: #1f4e79;
            color: white;
            padding: 20px;
        }

        .container {
            width: 90%;
            max-width: 500px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.15);
        }

        label {
            display: block;
            text-align: left;
            margin-top: 15px;
            font-weight: bold;
        }

        select,
        input[type="text"],
        input[type="file"] {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin-top: 7px;
        }

        button {
            background: #1f4e79;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }

        button:hover {
            background: #163a5c;
        }

        .back-button {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: #1f4e79;
        }

        .message {
            color: green;
            font-weight: bold;
        }

        .error {
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>📅 Upload Time Table</h1>
    </div>

    <div class="container">

        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}

            <label>Branch</label>

            <select name="branch" required>
                <option value="">Select Branch</option>
                <option value="CSE">CSE</option>
                <option value="ECE">ECE</option>
                <option value="EEE">EEE</option>
                <option value="MECH">MECH</option>
                <option value="CIVIL">CIVIL</option>
            </select>


            <label>Year</label>

            <select name="year" required>
                <option value="">Select Year</option>
                <option value="1">1st Year</option>
                <option value="2">2nd Year</option>
                <option value="3">3rd Year</option>
                <option value="4">4th Year</option>
            </select>


            <label>Section</label>

            <select name="section" required>
                <option value="">Select Section</option>
                <option value="A">A</option>
                <option value="B">B</option>
                <option value="C">C</option>
                <option value="D">D</option>
            </select>


            <label>Semester</label>

            <select name="semester" required>
                <option value="">Select Semester</option>
                <option value="1">1st Semester</option>
                <option value="2">2nd Semester</option>
            </select>


            <label>Room Number</label>

            <input
                type="text"
                name="room_no"
                placeholder="Example: 101"
                required
            >


            <label>Upload Time Table Image</label>

            <input
                type="file"
                name="timetable_file"
                accept="image/*"
                required
            >

            <button type="submit">
                📤 Upload Time Table
            </button>

        </form>


        {% if message %}
            <p class="message">{{ message }}</p>
        {% endif %}

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}


        <a
            href="{% url 'faculty_dashboard' %}"
            class="back-button"
        >
            ⬅ Back to Dashboard
        </a>

    </div>

</body>

</html>
